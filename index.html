<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تيم ميتر · TeamMeter</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#141a2e;--mu:#69708a;--bd:#e2e6f0;--pr:#4f46e5;--ok:#10b981;--bad:#ef4444;--warn:#f59e0b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#151b30;--tx:#eef1fb;--mu:#8e96b5;--bd:#262e4a;--pr:#818cf8}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#151b30;--tx:#eef1fb;--mu:#8e96b5;--bd:#262e4a;--pr:#818cf8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;line-height:1.5}
.w{max-width:760px;margin:0 auto;padding:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.logo{font-weight:800;font-size:20px;color:var(--pr)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
button,select,input{font:inherit;color:var(--tx)}
input,select{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;width:100%}
button{border:0;border-radius:10px;padding:9px 14px;cursor:pointer;background:var(--pr);color:#fff;font-weight:600}
button:disabled{opacity:.6}
button.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
button.d{background:var(--bad)}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tabs button{background:var(--card);color:var(--mu);border:1px solid var(--bd);white-space:nowrap}
.tabs button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.big{font-size:34px;font-weight:800}
.mu{color:var(--mu);font-size:13px}
.bar{height:8px;border-radius:8px;background:var(--bd);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.pill{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
.up{background:#10b98122;color:var(--ok)}.dn{background:#ef444422;color:var(--bad)}.st{background:#f59e0b22;color:var(--warn)}
.av{width:42px;height:42px;border-radius:12px;background:var(--pr);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.lb{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}.lb:last-child{border:0}
.lb.me{background:#4f46e51a;border-radius:10px;padding-inline:8px}
.ov{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:14px;z-index:20}
.ov .card{width:100%;max-width:420px;max-height:90%;overflow:auto}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
svg{max-width:100%}.err{color:var(--bad);font-size:13px}
</style>
</head>
<body>
<div class="w" id="app"><p class="mu">جاري التحميل…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ===== غيّر القيمتين دول من Supabase: Project Settings > API =====
const SUPABASE_URL="https://zmvjnowrossvksctwhad.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_SCBl9-EXW9bkG8vyXNwezg_UOorLfa_";
// ===============================================================
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const MO=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const KEYS=[["sh","النزولات الميدانية"],["tk","التاسكات"],["se","السيشنات والورش"],["mt","الاجتماعات الدورية"]];
let D={members:[]},S={tab:"members",modal:null,auth:"in",msg:""},session=null,me=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct=a=>a&&a[1]?Math.min(100,Math.round(a[0]/a[1]*100)):0;
const COM=["PR","HR","OR","SM","Board"];
const XF=[["tec","TEC"],["int","التفاعل"],["car","التدرج الوظيفي"],["bon","البونص"]];
// أوزان كل لجنة: g = مجموعات [[البنود],الدرجة]، x = أقصى درجة للتفاعل/التدرج/البونص
// لتغيير لجنة أضف سطرها هنا (مثال: HR:{g:[[["sh"],20],[["tk"],40]],x:{int:10,car:10,bon:10}})
const PRHR={g:[[["tk"],30,{q:5,dl:5}],[["mt","se"],30],[["sh"],20]],x:{int:10,car:10,bon:10}};
const CFG={
 PR:PRHR,HR:PRHR,
 SM:{g:[[["sh"],20],[["mt","se"],10]],x:{tec:50,int:10,car:10,bon:10}},
 OR:{g:[[["sh"],30],[["mt","se"],30],[["tk"],20]],x:{int:10,car:10,bon:10}}
};
// أي لجنة مش مكتوبة هنا (Board حاليا) بتتحسب بأوزان OR
const cfg=c=>CFG[c]||CFG.OR;
const ks=c=>KEYS.filter(([k])=>cfg(c).g.some(g=>g[0].includes(k)));
const xs=c=>XF.filter(([k])=>k in cfg(c).x);
const maxS=c=>{const f=cfg(c);return f.g.reduce((a,x)=>a+x[1],0)+Object.values(f.x).reduce((a,b)=>a+b,0)};
const KN=Object.fromEntries(KEYS);
const r1=x=>Math.round(x*10)/10;
const gx=(r,k)=>((r.exc||{})[k]||[]).reduce((s,x)=>s+(x.a?0.5:0.25),0);
const gparts=(r,g)=>{let d=0,t=0,e=0,Q=0,L=0;g[0].forEach(k=>{const a=r[k]||[0,0];d+=a[0];t+=a[1];e+=gx(r,k);((r.log||{})[k]||[]).forEach(x=>{if(x.q)Q++;if(x.l)L++})});const o=g[2]||{},q=o.q||0,l=o.dl||0;if(!t)return{b:0,q:0,l:0};const f=n=>Math.min(1,n/t);return{b:(g[1]-q-l)*Math.min(1,(d+e)/t),q:q*f(Q),l:l*f(L)}};
const gpts=(r,g)=>{const p=gparts(r,g);return p.b+p.q+p.l};
const mscore=(r,c)=>{if(r.man!=null)return r.man;const f=cfg(c);let s=f.g.reduce((a,g)=>a+gpts(r,g),0);for(const k in f.x)s+=Math.min(f.x[k],+r[k]||0);return r1(s)};
const months=m=>Object.keys(m.rec||{}).sort();
const last=m=>{const k=months(m);return k.length?k[k.length-1]:null};
const score=m=>{const k=last(m);return k?mscore(m.rec[k],m.committee):0};
const delta=m=>{const k=months(m);return k.length<2?0:mscore(m.rec[k[k.length-1]],m.committee)-mscore(m.rec[k[k.length-2]],m.committee)};
const comms=()=>[...new Set(D.members.map(m=>m.committee).filter(Boolean))];
const rankIn=m=>D.members.filter(x=>x.committee===m.committee).sort((a,b)=>score(b)-score(a));
const trend=d=>d>=5?'<span class="pill up">↗ +'+d+'%</span>':d<=-5?'<span class="pill dn">↘ '+d+'%</span>':'<span class="pill st">➡ مستقر</span>';
function theme(){const r=document.documentElement;r.dataset.theme=(r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches))?"light":"dark";localStorage.setItem("tm-theme",r.dataset.theme)}
{const t=localStorage.getItem("tm-theme");if(t)document.documentElement.dataset.theme=t}

async function load(){
  const [a,b]=await Promise.all([sb.from("members").select("*"),sb.from("records").select("*")]);
  if(a.error||b.error){S.msg=(a.error||b.error).message;D.members=[];return}
  const byId={};a.data.forEach(m=>{m.rec={};byId[m.id]=m});
  b.data.forEach(r=>{if(byId[r.member_id])byId[r.member_id].rec[r.month]=r.data});
  D.members=a.data;me=D.members.find(m=>m.user_id===session.user.id)||null;
}
async function boot(){
  const{data}=await sb.auth.getSession();session=data.session;
  sb.auth.onAuthStateChange(async(_e,s)=>{session=s;if(s)await load();render()});
  if(session)await load();
  render();
}
async function doAuth(signup){
  const email=$("#ae").value.trim(),password=$("#ap").value;S.msg="";
  if(!email||password.length<6){S.msg="اكتب الإيميل وباسورد 6 حروف على الأقل.";return render()}
  const r=signup?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
  if(r.error)S.msg=r.error.message;
  else if(signup&&!r.data.session)S.msg="تم إنشاء الحساب. افتح إيميلك وأكد الحساب ثم سجل دخول.";
  render();
}
async function logout(){await sb.auth.signOut();session=null;me=null;D.members=[];render()}

function chart(m){
  const k=months(m);if(!k.length)return'<p class="mu">لا توجد تقييمات بعد.</p>';
  const W=420,H=170,P=28,MX=maxS(m.committee),pts=k.map((x,i)=>[P+(k.length>1?i*(W-2*P)/(k.length-1):(W-2*P)/2),H-P-(mscore(m.rec[x],m.committee)/MX)*(H-2*P),mscore(m.rec[x],m.committee),x]);
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="تطور التقييم">`+[0,Math.round(MX/2),MX].map(v=>{const y=H-P-(v/MX)*(H-2*P);return`<line x1="${P}" x2="${W-P}" y1="${y}" y2="${y}" stroke="var(--bd)"/><text x="4" y="${y+4}" font-size="10" fill="var(--mu)">${v}</text>`}).join("")+
  `<polyline points="${pts.map(p=>p[0]+","+p[1]).join(" ")}" fill="none" stroke="var(--pr)" stroke-width="3" stroke-linejoin="round"/>`+
  pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="var(--pr)"/><text x="${p[0]}" y="${p[1]-9}" font-size="11" text-anchor="middle" fill="var(--tx)">${p[2]}</text><text x="${p[0]}" y="${H-8}" font-size="10" text-anchor="middle" fill="var(--mu)">${MO[+p[3].split("-")[1]-1]}</text>`).join("")+`</svg>`;
}
function breakdown(m){
  const k=last(m);if(!k)return'<p class="mu">لا توجد تقييمات بعد.</p>';const r=m.rec[k];
  const f=cfg(m.committee);
  return f.g.map(g=>{let d=0,t=0;g[0].forEach(k=>{const a=r[k]||[0,0];d+=a[0];t+=a[1]});const pp=gparts(r,g),p=r1(pp.b+pp.q+pp.l),o=g[2]||{};return`<div style="margin:9px 0"><div class="row" style="justify-content:space-between"><span>${g[0].map(k=>KN[k]).join(" + ")}</span><span class="mu">${d} / ${t} · <b>${p}</b> من ${g[1]}</span></div><div class="bar"><i style="width:${g[1]?p/g[1]*100:0}%"></i></div>${o.q||o.dl?`<div class="mu">التنفيذ ${r1(pp.b)} من ${g[1]-(o.q||0)-(o.dl||0)} · الجودة ${r1(pp.q)} من ${o.q||0} · الديدلاين ${r1(pp.l)} من ${o.dl||0}</div>`:""}${g[0].map(k=>logs(r,k)+excs(r,k)).join("")}</div>`}).join("")+xs(m.committee).map(([k,l])=>{const v=Math.min(f.x[k],+r[k]||0);return`<div style="margin:9px 0"><div class="row" style="justify-content:space-between"><span>${l}</span><span class="mu"><b>${v}</b> من ${f.x[k]}</span></div><div class="bar"><i style="width:${f.x[k]?v/f.x[k]*100:0}%"></i></div></div>`}).join("")+`<p class="mu">الاعتذارات المسجلة هذا الشهر: <b>${r.ex||0}</b></p>${r.man!=null?'<p class="mu">الدرجة الإجمالية مُدخلة يدوياً من الأدمن.</p>':""}`;
}
function memberView(m){
  const rk=rankIn(m),pos=rk.findIndex(x=>x.id===m.id)+1,top=rk.slice(0,3);
  return`<div class="card"><div class="row"><div class="av">${esc(m.name[0])}</div><div style="flex:1"><b>${esc(m.name)}</b><div class="mu">${esc(m.role||"عضو")} · لجنة ${esc(m.committee)}</div></div>${trend(delta(m))}</div></div>
  <div class="grid"><div class="card"><div class="mu">تقييمك الحالي</div><div class="big">${score(m)}<span class="mu">/${maxS(m.committee)}</span></div></div>
  <div class="card"><div class="mu">ترتيبك في اللجنة</div><div class="big">${pos}<span class="mu">/${rk.length}</span></div></div></div>
  <div class="card"><b>تطور أدائك عبر الشهور</b>${chart(m)}</div>
  <div class="card"><b>تفاصيل آخر شهر</b>${breakdown(m)}</div>
  <div class="card"><b>🏆 توب اللجنة</b>${top.map((x,i)=>`<div class="lb ${x.id===m.id?"me":""}"><span>${["🥇","🥈","🥉"][i]}</span><span style="flex:1">${esc(x.name)}${x.id===m.id?" (أنت)":""}</span><b>${score(x)}</b></div>`).join("")}
  ${pos>3?`<div class="lb me"><span>${pos}</span><span style="flex:1">${esc(m.name)} (أنت)</span><b>${score(m)}</b></div>`:""}</div>`;
}
function loginView(){
  const su=S.auth==="up";
  return`<div class="top"><span class="logo">TeamMeter · تيم ميتر</span><button class="g" onclick="theme()">🌓</button></div>
  <div class="card"><b>${su?"إنشاء حساب":"تسجيل الدخول"}</b>
  <label>الإيميل</label><input id="ae" type="email" autocomplete="email" dir="ltr">
  <label>الباسورد</label><input id="ap" type="password" autocomplete="${su?"new-password":"current-password"}" dir="ltr" onkeydown="if(event.key==='Enter')doAuth(${su})">
  <p class="err">${esc(S.msg)}</p>
  <div class="row"><button onclick="doAuth(${su})">${su?"إنشاء حساب":"دخول"}</button><button class="g" onclick="S.auth='${su?"in":"up"}';S.msg='';render()">${su?"عندي حساب":"حساب جديد؟"}</button></div>
  ${su?'<p class="mu">لازم الأدمن يكون ضاف إيميلك الأول عشان التسجيل يشتغل.</p>':""}</div>`;
}
function adminView(){
  const tabs=[["members","الأعضاء"],["committees","اللجان"],["dash","لوحة الشرف"]];
  const sc=D.members.map(score),avg=sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length):0;
  const sub=S.tab==="members"?`<div class="grid"><div class="card"><div class="mu">إجمالي الأعضاء</div><div class="big">${D.members.length}</div></div><div class="card"><div class="mu">متوسط التقييم</div><div class="big">${avg}</div></div></div>
  ${D.members.map(m=>`<div class="card"><div class="row"><div class="av">${esc(m.name[0])}</div><div style="flex:1"><b>${esc(m.name)}</b><div class="mu">${esc(m.role||"")} · ${esc(m.committee)} ${m.user_id?"":"· لم يسجّل بعد"}</div></div><div class="big" style="font-size:26px">${score(m)}</div></div>
  <div class="bar" style="margin:8px 0"><i style="width:${Math.min(100,score(m)/maxS(m.committee)*100)}%"></i></div>
  <div class="row">${trend(delta(m))}<span style="flex:1"></span><button class="g" onclick="S.modal={t:'rec',id:'${m.id}'};render()">+ تقييم شهر</button><button class="g" onclick="S.modal={t:'view',id:'${m.id}'};render()">عرض</button><button class="g" onclick="S.modal={t:'mem',id:'${m.id}'};render()">تعديل</button></div></div>`).join("")}`
  :S.tab==="committees"?comms().map(c=>{const r=D.members.filter(m=>m.committee===c).sort((a,b)=>score(b)-score(a)),a=Math.round(r.reduce((s,m)=>s+score(m),0)/r.length);return`<div class="card"><div class="row" style="justify-content:space-between"><b>لجنة ${esc(c)}</b><span class="mu">${r.length} أعضاء · متوسط ${a}%</span></div>${r.map((m,i)=>`<div class="lb"><span>${i+1}</span><span style="flex:1">${esc(m.name)}</span><b>${score(m)}</b></div>`).join("")}</div>`}).join("")||'<p class="mu">أضف أعضاء أولاً.</p>'
  :`<div class="card"><b>🏆 أفضل 5 في الفريق</b>${[...D.members].sort((a,b)=>score(b)-score(a)).slice(0,5).map((m,i)=>`<div class="lb"><span>${i+1}</span><span style="flex:1">${esc(m.name)} <span class="mu">· ${esc(m.committee)}</span></span>${trend(delta(m))}<b>${score(m)}</b></div>`).join("")}</div>
  <div class="card"><b>⚠️ يحتاجون متابعة (أقل من 75% أو في النازل)</b>${D.members.filter(m=>score(m)/maxS(m.committee)<0.75||delta(m)<=-5).map(m=>`<div class="lb"><span style="flex:1">${esc(m.name)}</span>${trend(delta(m))}<b>${score(m)}</b></div>`).join("")||'<p class="mu">لا أحد 👏</p>'}</div>`;
  return`<div class="top"><span class="logo">TeamMeter · لوحة الأدمن</span><div class="row"><button onclick="S.modal={t:'mem'};render()">+ عضو</button><button class="g" onclick="theme()">🌓</button><button class="g" onclick="logout()">خروج</button></div></div>
  <div class="tabs">${tabs.map(t=>`<button class="${S.tab===t[0]?"on":""}" onclick="S.tab='${t[0]}';render()">${t[1]}</button>`).join("")}</div>${sub}`;
}
function modal(){
  const t=S.modal,m=D.members.find(x=>x.id===t.id);
  if(t.t==="view")return`<div class="ov" onclick="if(event.target===this){S.modal=null;render()}"><div class="card">${memberView(m)}<button class="g" onclick="S.modal=null;render()">إغلاق</button></div></div>`;
  if(t.t==="mem")return`<div class="ov"><div class="card"><b>${m?"تعديل عضو":"إضافة عضو"}</b>
  <label>الإيميل (هيسجل بيه)</label><input id="me" type="email" dir="ltr" value="${esc(m?.email)}"><label>الاسم</label><input id="mn" value="${esc(m?.name)}"><label>الدور</label><input id="mr" value="${esc(m?.role)}"><label>اللجنة</label><select id="mc">${[...new Set([...COM,m?.committee].filter(Boolean))].map(c=>`<option ${c===m?.committee?"selected":""}>${esc(c)}</option>`).join("")}</select>
  <p class="err" id="mm"></p><div class="row" style="margin-top:12px"><button onclick="saveMem('${m?.id||""}')">حفظ</button><button class="g" onclick="S.modal=null;render()">إلغاء</button>${m&&m.id!==me?.id?`<button class="d" onclick="delMem('${m.id}')">حذف</button>`:""}</div></div></div>`;
  const now=new Date().toISOString().slice(0,7);
  return`<div class="ov"><div class="card"><b>تقييم شهر: ${esc(m.name)}</b><label>الشهر</label><input id="rm" type="month" value="${now}" onchange="fillRec('${m.id}')">
  ${ks(m.committee).map(([id,l])=>`<label>${l} (المنجز / المطلوب)</label><div class="row"><input id="${id}a" type="number" min="0" placeholder="منجز"><input id="${id}b" type="number" min="0" placeholder="مطلوب"></div><div id="lg_${id}"></div><button type="button" class="g" style="margin-top:6px" onclick="addLog('${id}')">+ إضافة تاريخ</button><div id="ex_${id}"></div><button type="button" class="g" style="margin-top:6px" onclick="addEx('${id}')">+ إضافة اعتذار</button>`).join("")}
  ${xs(m.committee).map(([k,l])=>`<label>${l} (من ${cfg(m.committee).x[k]})</label><input id="${k}" type="number" min="0" max="${cfg(m.committee).x[k]}" step="0.5">`).join("")}
  <label>درجة إجمالية يدوية من 0 إلى ${maxS(m.committee)} (اختياري، لو كتبتها بتحل محل الحساب التلقائي)</label><input id="rmn" type="number" min="0" max="${maxS(m.committee)}" placeholder="سيبها فاضية للحساب التلقائي">
  <p class="err" id="mm"></p><div class="row" style="margin-top:12px"><button onclick="saveRec('${m.id}')">حفظ التقييم</button><button class="g" onclick="S.modal=null;render()">إلغاء</button></div></div></div>`;
}
const curCom=()=>(D.members.find(x=>x.id===(S.modal||{}).id)||{}).committee;
const hasQ=(c,k)=>cfg(c).g.some(g=>g[0].includes(k)&&g[2]&&(g[2].q||g[2].dl));
function addLog(i,d,n,q,l){const e=document.createElement("div");e.className="row";e.style.marginTop="6px";const fq=hasQ(curCom(),i);e.innerHTML=`<input type="date" class="ld" value="${esc(d||"")}" style="flex:1"><input class="ln" placeholder="ملاحظة (اختياري)" value="${esc(n||"")}" style="flex:2">${fq?`<span class="mu"><input type="checkbox" class="lq" style="width:auto" ${q?"checked":""}> جودة</span><span class="mu"><input type="checkbox" class="ll" style="width:auto" ${l?"checked":""}> ديدلاين</span>`:""}<button type="button" class="g" onclick="this.parentNode.remove();syncCnt('${i}')">×</button>`;$("#lg_"+i).appendChild(e);syncCnt(i)}
function addEx(i,d,n,a){const e=document.createElement("div");e.className="row";e.style.marginTop="6px";e.innerHTML=`<input type="date" class="ed" value="${esc(d||"")}" style="flex:1"><input class="en" placeholder="سبب الاعتذار" value="${esc(n||"")}" style="flex:2"><select class="ea" style="flex:1"><option value="1" ${a===false?"":"selected"}>مقبول</option><option value="0" ${a===false?"selected":""}>غير مقبول</option></select><button type="button" class="g" onclick="this.parentNode.remove()">×</button>`;$("#ex_"+i).appendChild(e)}
function syncCnt(i){const n=$("#lg_"+i).children.length;if(n)$("#"+i+"a").value=n}
function fillRec(id){const m=D.members.find(x=>x.id===id),r=(m.rec||{})[$("#rm").value]||{};ks(m.committee).forEach(([i])=>{const a=r[i]||["",""];$("#lg_"+i).innerHTML="";((r.log||{})[i]||[]).forEach(x=>addLog(i,x.d,x.n,x.q,x.l));$("#ex_"+i).innerHTML="";((r.exc||{})[i]||[]).forEach(x=>addEx(i,x.d,x.n,x.a));$("#"+i+"a").value=a[0];$("#"+i+"b").value=a[1]});xs(m.committee).forEach(([k])=>{$("#"+k).value=r[k]??""});$("#rmn").value=r.man??""}
const logs=(r,id)=>((r.log||{})[id]||[]).length?'<div class="mu" style="margin-top:4px">'+KN[id]+": "+r.log[id].map(x=>esc(x.d.slice(5).split("-").reverse().join("/"))+(x.n?" ("+esc(x.n)+")":"")+(x.q?" ✓جودة":"")+(x.l?" ✓ديدلاين":"")).join(" · ")+'</div>':"";
const excs=(r,id)=>((r.exc||{})[id]||[]).length?'<div class="mu" style="margin-top:4px">اعتذارات '+KN[id]+": "+r.exc[id].map(x=>esc(x.d.slice(5).split("-").reverse().join("/"))+(x.n?" ("+esc(x.n)+")":"")+(x.a?" ✓مقبول":" ✗غير مقبول")).join(" · ")+'</div>':"";
async function saveMem(id){
  const v=s=>$(s).value.trim(),row={email:v("#me").toLowerCase(),name:v("#mn"),role:v("#mr")||"عضو",committee:v("#mc")};
  if(!row.email||!row.name||!row.committee){$("#mm").textContent="الإيميل والاسم واللجنة مطلوبين";return}
  const r=id?await sb.from("members").update(row).eq("id",id):await sb.from("members").insert(row);
  if(r.error){$("#mm").textContent=r.error.message;return}
  S.modal=null;await load();render();
}
async function delMem(id){if(!confirm("حذف العضو وكل تقييماته نهائياً؟"))return;const r=await sb.from("members").delete().eq("id",id);if(r.error)return alert(r.error.message);S.modal=null;await load();render()}
async function saveRec(id){
  const k=$("#rm").value;if(!k)return;const r={};
  const cm=(D.members.find(x=>x.id===id)||{}).committee;ks(cm).forEach(([i])=>r[i]=[+$("#"+i+"a").value||0,+$("#"+i+"b").value||0]);xs(cm).forEach(([k])=>{const v=$("#"+k).value.trim();if(v!=="")r[k]=Math.max(0,+v)});
  const lg={};ks(cm).forEach(([i])=>{const L=[...$("#lg_"+i).children].map(e=>({d:e.querySelector(".ld").value,n:e.querySelector(".ln").value.trim(),q:e.querySelector(".lq")?.checked?1:0,l:e.querySelector(".ll")?.checked?1:0})).filter(x=>x.d).sort((a,b)=>a.d.localeCompare(b.d));if(L.length)lg[i]=L});if(Object.keys(lg).length)r.log=lg;const ex={};ks(cm).forEach(([i])=>{const L=[...$("#ex_"+i).children].map(e=>({d:e.querySelector(".ed").value,n:e.querySelector(".en").value.trim(),a:e.querySelector(".ea").value==="1"})).filter(x=>x.d).sort((a,b)=>a.d.localeCompare(b.d));if(L.length)ex[i]=L});if(Object.keys(ex).length)r.exc=ex;r.ex=Object.values(ex).reduce((a,l)=>a+l.length,0);const mv=$("#rmn").value.trim();if(mv!=="")r.man=Math.max(0,Math.min(maxS((D.members.find(x=>x.id===id)||{}).committee),+mv));
  const x=await sb.from("records").upsert({member_id:id,month:k,data:r},{onConflict:"member_id,month"});
  if(x.error){$("#mm").textContent=x.error.message;return}
  S.modal=null;await load();render();
}
function render(){
  let h;
  if(!session)h=loginView();
  else if(me&&me.is_admin)h=adminView();
  else if(me)h=`<div class="top"><span class="logo">TeamMeter</span><div class="row"><button class="g" onclick="theme()">🌓</button><button class="g" onclick="logout()">خروج</button></div></div>`+memberView(me);
  else h=`<div class="top"><span class="logo">TeamMeter</span><button class="g" onclick="logout()">خروج</button></div><div class="card"><p>${S.msg?esc(S.msg):"الإيميل ده مش مسجل عند الأدمن. كلّمه عشان يضيفك ثم سجل دخول تاني."}</p></div>`;
  $("#app").innerHTML=h+(S.modal&&me&&me.is_admin?modal():"");
  if(S.modal&&S.modal.t==="rec"&&me&&me.is_admin)fillRec(S.modal.id);
}
boot();
</script>
</body>
</html>

@page{size:A4;margin:12mm}

<script>

const MO=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const KEYS=[["sh","النزولات الميدانية"],["tk","التاسكات"],["se","السيشنات والورش"],["mt","الاجتماعات الدورية"]];

const pct=a=>a&&a[1]?Math.min(100,Math.round(a[0]/a[1]*100)):0;
const COM=["PR","HR","OR","SM","Board"];
const XF=[["tec","TEC"],["int","التفاعل"],["car","التدرج الوظيفي"],["bon","البونص"]];
// أوزان كل لجنة: g = مجموعات [[البنود],الدرجة]، x = أقصى درجة للتفاعل/التدرج/البونص

const PRHR={g:[[["tk"],30,{q:10,dl:10}],[["mt","se"],30],[["sh"],20]],x:{int:10,car:10,bon:10}};
const CFG={
 PR:PRHR,HR:PRHR,
 SM:{g:[[["sh"],20],[["mt","se"],10]],x:{tec:50,int:10,car:10,bon:10}},
 OR:{g:[[["sh"],30],[["mt","se"],30],[["tk"],20,{q:5,dl:5}]],x:{int:10,car:10,bon:10}}
};
// أي لجنة مش مكتوبة هنا (Board حاليا) بتتحسب بأوزان OR
const cfg=c=>CFG[c]||CFG.OR;
const ks=c=>KEYS.filter(([k])=>cfg(c).g.some(g=>g[0].includes(k)));
const xs=c=>XF.filter(([k])=>k in cfg(c).x);
const maxS=c=>{const f=cfg(c);return f.g.reduce((a,x)=>a+x[1],0)+Object.values(f.x).reduce((a,b)=>a+b,0)};
const KN=Object.fromEntries(KEYS);
const r1=x=>Math.round(x*100)/100;
const grade=t=>t>=90?"A":t>=80?"B":t>=70?"C":t>=60?"D":t>0?"F":"";
const gx=(r,k)=>((r.exc||{})[k]||[]).reduce((s,x)=>s+(x.a?0.5:0.25),0);
const gparts=(r,g)=>{let d=0,t=0,e=0,sq=0,sl=0,n=0;g[0].forEach(k=>{const a=r[k]||[0,0];d+=a[0];t+=a[1];e+=gx(r,k);n+=((r.exc||{})[k]||[]).length;((r.log||{})[k]||[]).forEach(x=>{n++;sq+=Math.min(5,+x.q||0);sl+=x.l?1:0})});const o=g[2]||{},q=o.q||0,l=o.dl||0;if(!t)return{b:0,q:0,l:0};return{b:(g[1]-q-l)*Math.min(1,(d+e)/t),q:q*Math.min(1,sq/(5*t)),l:l*Math.min(1,sl/t)}};
const gpts=(r,g)=>{const p=gparts(r,g);return p.b+p.q+p.l};
const mscore=(r,c)=>{if(r.man!=null)return r.man;const f=cfg(c);let s=f.g.reduce((a,g)=>a+gpts(r,g),0);for(const k in f.x)s+=Math.min(f.x[k],+r[k]||0);return r1(s)};
const months=m=>Object.keys(m.rec||{}).sort();
const last=m=>{const k=months(m);return k.length?k[k.length-1]:null};
const score=m=>{const k=last(m);return k?mscore(m.rec[k],m.committee):0};
const delta=m=>{const k=months(m);return k.length<2?0:mscore(m.rec[k[k.length-1]],m.committee)-mscore(m.rec[k[k.length-2]],m.committee)};
const comms=()=>[...new Set(D.members.map(m=>m.committee).filter(Boolean))];
const rankIn=m=>D.members.filter(x=>x.committee===m.committee).sort((a,b)=>score(b)-score(a));
const trend=d=>!isAdm()?"":d>=5?'<span class="pill up">↗ +'+d+'%</span>':d<=-5?'<span class="pill dn">↘ '+d+'%</span>':'<span class="pill st">➡ مستقر</span>';
function theme(){const r=document.documentElement;r.dataset.theme=r.dataset.theme==="light"?"dark":"light";try{localStorage.setItem("tm-theme",r.dataset.theme)}catch(e){}}
{const t=localStorage.getItem("tm-theme");if(t)document.documentElement.dataset.theme=t}
function chart(m){
  const k=months(m);if(!k.length)return'<p class="mu">لا توجد تقييمات بعد.</p>';
  const W=420,H=170,P=28,MX=maxS(m.committee),pts=k.map((x,i)=>[P+(k.length>1?i*(W-2*P)/(k.length-1):(W-2*P)/2),H-P-(mscore(m.rec[x],m.committee)/MX)*(H-2*P),mscore(m.rec[x],m.committee),x]);
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="تطور التقييم">`+[0,Math.round(MX/2),MX].map(v=>{const y=H-P-(v/MX)*(H-2*P);return`<line x1="${P}" x2="${W-P}" y1="${y}" y2="${y}" stroke="var(--bd)"/><text x="4" y="${y+4}" font-size="10" fill="var(--mu)">${v}</text>`}).join("")+
  `<polyline points="${pts.map(p=>p[0]+","+p[1]).join(" ")}" fill="none" stroke="var(--pr)" stroke-width="3" stroke-linejoin="round"/>`+
  pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="var(--pr)"/><text x="${p[0]}" y="${p[1]-9}" font-size="11" text-anchor="middle" fill="var(--tx)">${p[2]}</text><text x="${p[0]}" y="${H-8}" font-size="10" text-anchor="middle" fill="var(--mu)">${MO[+p[3].split("-")[1]-1]}</text>`).join("")+`</svg>`;
}
function breakdown(m){
  const k=last(m);if(!k)return'<p class="mu">لا توجد تقييمات بعد.</p>';const r=m.rec[k];
  const f=cfg(m.committee);
  return f.g.map(g=>{let d=0,t=0;g[0].forEach(k=>{const a=r[k]||[0,0];d+=a[0];t+=a[1]});const pp=gparts(r,g),p=r1(pp.b+pp.q+pp.l),o=g[2]||{};return`<div style="margin:9px 0"><div class="row" style="justify-content:space-between"><span>${g[0].map(k=>KN[k]).join(" + ")}</span><span class="mu">${d} / ${t} · <b>${p}</b> من ${g[1]}</span></div><div class="bar"><i style="width:${g[1]?p/g[1]*100:0}%"></i></div>${o.q||o.dl?`<div class="mu">التسليم ${r1(pp.b)} من ${g[1]-(o.q||0)-(o.dl||0)} · الجودة ${r1(pp.q)} من ${o.q||0} · الديدلاين ${r1(pp.l)} من ${o.dl||0}</div>`:""}${g[0].map(k=>logs(r,k)+excs(r,k)).join("")}</div>`}).join("")+xs(m.committee).map(([k,l])=>{const v=Math.min(f.x[k],+r[k]||0);return`<div style="margin:9px 0"><div class="row" style="justify-content:space-between"><span>${l}</span><span class="mu"><b>${v}</b> من ${f.x[k]}</span></div><div class="bar"><i style="width:${f.x[k]?v/f.x[k]*100:0}%"></i></div></div>`}).join("")+`<p class="mu">الاعتذارات المسجلة هذا الشهر: <b>${r.ex||0}</b></p>${r.man!=null?'<p class="mu">الدرجة الإجمالية مُدخلة يدوياً من الأدمن.</p>':""}`;
}
const curCom=()=>(D.members.find(x=>x.id===(S.modal||{}).id)||{}).committee;
const hasQ=(c,k)=>cfg(c).g.some(g=>g[0].includes(k)&&g[2]&&(g[2].q||g[2].dl));
function addLog(i,d,n,q,l){const e=document.createElement("div");e.className="row";e.style.marginTop="6px";const fq=hasQ(curCom(),i);e.innerHTML=`<input type="date" class="ld" value="${esc(d||"")}" style="flex:1"><input class="ln" placeholder="ملاحظة (اختياري)" value="${esc(n||"")}" style="flex:2">${fq?`<input type="number" class="lq" min="0" max="5" step="0.5" placeholder="جودة /5" value="${q??""}" style="flex:1;min-width:80px"><label style="display:flex;gap:5px;align-items:center;margin:0;color:var(--tx)"><input type="checkbox" class="ll" style="width:auto" ${l?"checked":""}> سلّم في الديدلاين</label>`:""}<button type="button" class="g" onclick="this.parentNode.remove();syncCnt('${i}')">×</button>`;$("#lg_"+i).appendChild(e);syncCnt(i)}
function addEx(i,d,n,a){const e=document.createElement("div");e.className="row";e.style.marginTop="6px";e.innerHTML=`<input type="date" class="ed" value="${esc(d||"")}" style="flex:1"><input class="en" placeholder="سبب الاعتذار" value="${esc(n||"")}" style="flex:2"><select class="ea" style="flex:1"><option value="1" ${a===false?"":"selected"}>مقبول</option><option value="0" ${a===false?"selected":""}>غير مقبول</option></select><button type="button" class="g" onclick="this.parentNode.remove()">×</button>`;$("#ex_"+i).appendChild(e)}

const logs=(r,id)=>((r.log||{})[id]||[]).length?'<div class="mu" style="margin-top:4px">'+KN[id]+": "+r.log[id].map(x=>esc(x.d.slice(5).split("-").reverse().join("/"))+(x.n?" ("+esc(x.n)+")":"")+(x.q!=null?" جودة "+x.q:"")+(x.l!=null?(x.l?" ✓ في الميعاد":" ✗ متأخر"):"")).join(" · ")+'</div>':"";
const excs=(r,id)=>((r.exc||{})[id]||[]).length?'<div class="mu" style="margin-top:4px">اعتذارات '+KN[id]+": "+r.exc[id].map(x=>esc(x.d.slice(5).split("-").reverse().join("/"))+(x.n?" ("+esc(x.n)+")":"")+(x.a?" ✓مقبول":" ✗غير مقبول")).join(" · ")+'</div>':"";
async function saveRec(id){
  const k=$("#rm").value;if(!k)return;const r={};
  const cm=(D.members.find(x=>x.id===id)||{}).committee;ks(cm).forEach(([i])=>r[i]=[+$("#"+i+"a").value||0,+$("#"+i+"b").value||0]);xs(cm).forEach(([k])=>{const v=$("#"+k).value.trim();if(v!=="")r[k]=Math.max(0,+v)});
  const lg={};ks(cm).forEach(([i])=>{const L=[...$("#lg_"+i).children].map(e=>({d:e.querySelector(".ld").value,n:e.querySelector(".ln").value.trim(),q:e.querySelector(".lq")?Math.max(0,Math.min(5,+e.querySelector(".lq").value||0)):undefined,l:e.querySelector(".ll")?(e.querySelector(".ll").checked?1:0):undefined})).filter(x=>x.d).sort((a,b)=>a.d.localeCompare(b.d));if(L.length)lg[i]=L});if(Object.keys(lg).length)r.log=lg;const ex={};ks(cm).forEach(([i])=>{const L=[...$("#ex_"+i).children].map(e=>({d:e.querySelector(".ed").value,n:e.querySelector(".en").value.trim(),a:e.querySelector(".ea").value==="1"})).filter(x=>x.d).sort((a,b)=>a.d.localeCompare(b.d));if(L.length)ex[i]=L});if(Object.keys(ex).length)r.exc=ex;r.ex=Object.values(ex).reduce((a,l)=>a+l.length,0);const mv=$("#rmn").value.trim();if(mv!=="")r.man=Math.max(0,Math.min(maxS((D.members.find(x=>x.id===id)||{}).committee),+mv));

async function load(){
  const[a,b,w,n,su,fo,bd]=await Promise.all([sb.from("members").select("*"),sb.from("records").select("*"),sb.from("warnings").select("*"),sb.from("announced").select("month"),sb.from("signups").select("*").order("created_at"),sb.from("follows").select("*"),sb.from("board").select("*").order("sort")]);
  if(a.error||b.error){S.msg=(a.error||b.error).message;D.members=[];loaded=true;return}
  const by={};a.data.forEach(m=>{m.rec={};m.meta={};by[m.id]=m});
  b.data.forEach(r=>{const m=by[r.member_id];if(m){m.rec[r.month]=r.data;m.meta[r.month]={by:r.by_member,at:r.updated_at}}});
  D.members=a.data;D.warn=w.data||[];D.ann=(n.data||[]).map(x=>x.month);D.signups=su.data||[];D.follows=fo.data||[];D.board=bd.data||[];
  me=D.members.find(m=>m.user_id===session.user.id)||null;
  const c=await sb.rpc("my_warning_count");myWarn=c.data||0;
  if(me&&!touched){touched=true;startPing()}
  else{const st=await sb.rpc("my_signup_status");S.signup=st.data||null}
  const AT=["members","req","committees","dash","announce","seen","hr","board","photos"];
  if(isAdm()&&!AT.includes(S.tab))S.tab="members";
  else if(isMgr()&&!["follow","me","leaders"].includes(S.tab))S.tab="follow";
  else if(me&&!isAdm()&&!isMgr()&&!["me","leaders"].includes(S.tab))S.tab="me";
  if(!restored){restored=true;try{const o=JSON.parse(localStorage.getItem("tm-open-modal")||"null");
    if(o&&me&&["rec","mem"].includes(o.t)&&(isAdm()||(o.t==="rec"&&D.follows.some(f=>f.manager_id===me.id&&f.member_id===o.id)))&&(!o.id||D.members.find(x=>x.id===o.id)))S.modal=o}catch(e){}}
  loaded=true;
}

async function boot(){
  const{data}=await sb.auth.getSession();session=data.session;
  sb.auth.onAuthStateChange((ev,s)=>{session=s;setTimeout(async()=>{
    if(ev==="PASSWORD_RECOVERY")S.recover=true;
    else if(!s){me=null;loaded=false;touched=false;D=emptyD()}
    else if(ev!=="INITIAL_SESSION"){if(!me)loaded=false;render();await load()}
    render()},0)});
  if(typeof document.addEventListener==="function"){document.addEventListener("input",draftSave);document.addEventListener("change",draftSave)}
  if(session)await load();
  render();
}
async function doAuth(signup){
  const email=$("#ae").value.trim(),password=$("#ap").value,full=signup?$("#an").value.trim():"";S.msg="";S.em=email;S.fn=full;
  if(!email||password.length<6){S.msg="اكتب الإيميل وكلمة مرور 6 حروف على الأقل.";return render()}
  if(signup&&full.split(/\s+/).length<2){S.msg="اكتب اسمك ثنائي على الأقل.";return render()}
  const rr=signup?$("#ar").value:"",cc=signup?$("#ac").value:"",bb=signup?chipsVal("abcs"):[];
  if(signup){S.fr=rr;S.fc=cc;S.fb=bb;if(rr==="Board"&&!bb.length){S.msg="اختار إنت مسؤول في لجنة إيه (واحدة على الأقل).";return render()}}
  const r=signup?await sb.auth.signUp({email,password,options:{data:{full_name:full,req_role:rr,req_committee:cc,req_board:rr==="Board"?bb.join(","):""}}}):await sb.auth.signInWithPassword({email,password});
  if(r.error)S.msg=errAr(r.error.message);
  else if(signup&&!r.data.session)S.msg="تم إنشاء الحساب. افتح إيميلك وأكد الحساب ثم سجل دخول.";
  render();
}

async function resizeImg(f,n,q){const bm=await createImageBitmap(f),k=Math.min(1,n/Math.max(bm.width,bm.height)),w=Math.round(bm.width*k),h=Math.round(bm.height*k),c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.imageSmoothingQuality="high";x.drawImage(bm,0,0,w,h);return new Promise(r=>c.toBlob(r,"image/jpeg",q||0.97))}
const thumb=u=>u?u.replace(/\.jpg(\?|$)/,"_t.jpg$1"):u;
const imgT=(u,cls,st)=>u?`<img ${cls?`class="${cls}"`:""} ${st?`style="${st}"`:""} src="${esc(thumb(u))}" onerror="this.onerror=null;this.src='${esc(u)}'" loading="lazy" alt="">`:"";
async function upAvatar(f){
  if(!f)return;
  try{
    const blob=await resizeImg(f,4096,.97),path=session.user.id+".jpg";
    const up=await sb.storage.from("avatars").upload(path,blob,{upsert:true,contentType:"image/jpeg"});if(up.error)throw up.error;
    try{const tb=await resizeImg(f,640,.9);await sb.storage.from("avatars").upload(session.user.id+"_t.jpg",tb,{upsert:true,contentType:"image/jpeg"})}catch(e){}
    const url=sb.storage.from("avatars").getPublicUrl(path).data.publicUrl+"?v="+Date.now();
    const r=await sb.rpc("set_my_avatar",{u:url});if(r.error)throw r.error;
    await load();render();
  }catch(e){alert("تعذر رفع الصورة: "+(e.message||e)+"\nلو الصورة HEIC (من الآيفون) حوّلها JPG الأول.")}
}

  const sc=m=>mo&&m.rec[mo]?mscore(m.rec[mo],m.committee):-1,rows=[...L].sort((a,b)=>sc(b)-sc(a));

async function approve(uid){
  const s=D.signups.find(x=>x.user_id===uid),v=i=>$("#"+i+"_"+uid).value.trim(),name=v("sn");
  if(!name){$("#se_"+uid).textContent="اكتب الاسم";return}
  if(v("sr")==="Board"&&!chipsVal("sbcs_"+uid).length){$("#se_"+uid).textContent="اختار هو مسؤول في لجنة إيه";return}
  const r=await sb.from("members").insert({email:s.email.toLowerCase(),name,role:v("sr")||"Member",committee:v("sc"),user_id:uid}).select("id").single();
  if(r.error){$("#se_"+uid).textContent=r.error.message;return}
  if(v("sr")==="Board"){const bs=chipsVal("sbcs_"+uid);if(bs.length){const be=await syncBoard(r.data.id,name,true,bs,v("sbp"));if(be){$("#se_"+uid).textContent="اتقبل العضو لكن البورد ما اتحفظش: "+be.message;await load();return}}}
  if(v("sc")==="HR"){const picks=[...document.querySelectorAll(".fp_"+uid+":checked")].map(x=>x.value);
    if(picks.length){const f=await sb.from("follows").insert(picks.map(p=>({manager_id:r.data.id,member_id:p})));if(f.error){$("#se_"+uid).textContent="اتقبل العضو لكن المتابعات ما اتحفظتش: "+f.error.message;await load();return}}}
  await sb.from("signups").delete().eq("user_id",uid);await load();render();
}
async function setReq(uid,st){const r=await sb.from("signups").update({status:st}).eq("user_id",uid);if(r.error)return alert(r.error.message);await load();render()}
async function ping(){
  if(!me||document.visibilityState==="hidden")return;
  let r=await sb.rpc("ping_seen");
  if(r.error)r=await sb.rpc("touch_seen");
  S.seenErr=r.error?r.error.message:null;
}
function startPing(){ping();setInterval(ping,45000);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")ping()})}

    <p class="err" id="mm"></p><div class="row" style="margin-top:12px"><button onclick="saveMem('${m?.id||""}')">حفظ</button><button class="g" onclick="closeM(true)">إلغاء</button>${m&&m.id!==me?.id?`<button class="d" onclick="delMem('${m.id}')">حذف</button>`:""}</div></div></div>`;}
  if(!m)return"";

  if(t.t==="hist"){const ms=months(m).sort().reverse(),mx=maxS(m.committee);

function togFl(){const w=document.getElementById("flw"),c=$("#mc");if(w&&c)w.style.display=c.value==="HR"?"block":"none"}
function filterFl(q){q=q.trim();document.querySelectorAll(".fli").forEach(e=>e.style.display=(!q||e.dataset.n.includes(q))?"flex":"none")}
async function saveMem(id){
  const v=s=>$(s).value.trim(),row={email:v("#me").toLowerCase(),name:v("#mn"),role:v("#mr")||"Member",committee:v("#mc")},isB=row.role==="Board",bcs=chipsVal("mbcs");
  if(!row.email||!row.name||!row.committee){$("#mm").textContent="الإيميل والاسم واللجنة مطلوبين";return}
  if(isB&&!bcs.length){$("#mm").textContent="اختار هو مسؤول في لجنة إيه (واحدة على الأقل)";return}
  let mid=id;
  if(id){const r=await sb.from("members").update(row).eq("id",id);if(r.error){$("#mm").textContent=r.error.message;return}}
  else{const r=await sb.from("members").insert(row).select("id").single();if(r.error){$("#mm").textContent=r.error.message;return}mid=r.data.id}
  const picks=row.committee==="HR"?[...document.querySelectorAll(".fl:checked")].map(x=>x.value):[];
  const d=await sb.from("follows").delete().eq("manager_id",mid);if(d.error){$("#mm").textContent=d.error.message;return}
  if(picks.length){const f=await sb.from("follows").insert(picks.map(p=>({manager_id:mid,member_id:p})));if(f.error){$("#mm").textContent=f.error.message;return}}
  const be=await syncBoard(mid,row.name,isB,bcs,v("#mbp"));if(be){$("#mm").textContent="اتحفظ العضو لكن البورد ما اتحفظش: "+be.message;await load();return}
  try{localStorage.removeItem("tm-draft:mem:"+(id||"new"))}catch(e){}
  S.modal=null;await load();render();
}
async function saveBoard(id){
  const v=s=>$(s).value.trim(),cs=[...document.querySelectorAll("#bcs .bcm.on")].map(x=>x.dataset.c),row={name:v("#bn"),position:v("#bp"),committees:cs,committee:cs.length===1?cs[0]:null,member_id:v("#bm")||null};
  if(!row.name||!row.position){$("#mm").textContent="الاسم والمنصب مطلوبين";return}
  if(row.member_id&&!cs.length){$("#mm").textContent="اختار لجنة واحدة على الأقل لحساب المسؤول";return}
  try{
    if(bFile){const base=id||crypto.randomUUID(),blob=await resizeImg(bFile,4096,.97),path=base+".jpg";
      const up=await sb.storage.from("board").upload(path,blob,{upsert:true,contentType:"image/jpeg"});if(up.error)throw up.error;
      try{await sb.storage.from("board").upload(base+"_t.jpg",await resizeImg(bFile,640,.9),{upsert:true,contentType:"image/jpeg"})}catch(e){}
      row.photo_url=sb.storage.from("board").getPublicUrl(path).data.publicUrl+"?v="+Date.now()}
    const r=id?await sb.from("board").update(row).eq("id",id):await sb.from("board").insert(row);if(r.error)throw r.error;
  }catch(e){$("#mm").textContent=e.message||String(e);return}
  bFile=null;S.modal=null;await load();render();
}
async function delBoard(id){if(!confirm("حذف من البورد؟"))return;const r=await sb.from("board").delete().eq("id",id);if(r.error)return alert(r.error.message);await load();render()}
async function dlPhoto(i){
  const x=PH[i];if(!x)return;
  try{const b=await (await fetch(x.u)).blob(),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=nm(x.n||"photo")+".jpg";a.click()}
  catch(e){window.open(x.u,"_blank")}
}
async function editTotal(id,k){
  const m=D.members.find(x=>x.id===id),r={...m.rec[k]},mx=maxS(m.committee);
  const v=prompt(`الدرجة الإجمالية لشهر ${ml(k)} (من ${mx}).\nسيبها فاضية للرجوع للحساب التلقائي.`,r.man!=null?r.man:mscore(r,m.committee));
  if(v===null)return;
  if(v.trim()==="")delete r.man;else r.man=Math.max(0,Math.min(mx,+v||0));
  const x=await sb.from("records").upsert({member_id:id,month:k,data:r},{onConflict:"member_id,month"});if(x.error)return alert(x.error.message);
  await load();render();
}
async function delRec(id,k){if(!confirm("حذف تقييم الشهر ده؟"))return;const x=await sb.from("records").delete().eq("member_id",id).eq("month",k);if(x.error)return alert(x.error.message);await load();render()}

function clearDraft(id,mo){try{localStorage.removeItem(dk(id,mo))}catch(e){}}
function closeM(discard){
  if(discard&&S.modal){
    if(S.modal.t==="rec")clearDraft(S.modal.id,S.modal.mo||($("#rm")&&$("#rm").value));
    if(S.modal.t==="mem"){try{localStorage.removeItem("tm-draft:mem:"+(S.modal.id||"new"))}catch(e){}}
  }
  S.modal=null;try{localStorage.removeItem("tm-open-modal")}catch(e){}render();
}
function draftCollect(){
  const g=i=>document.getElementById(i),v=i=>g(i)?g(i).value:"",m=D.members.find(x=>x.id===S.modal.id),o={f:{},log:{},exc:{}};
  ks(m.committee).forEach(([i])=>{o.f[i+"a"]=v(i+"a");o.f[i+"b"]=v(i+"b");
    o.log[i]=[...g("lg_"+i).children].map(e=>({d:e.querySelector(".ld").value,n:e.querySelector(".ln").value,q:e.querySelector(".lq")?e.querySelector(".lq").value:"",l:e.querySelector(".ll")?e.querySelector(".ll").checked:false}));
    o.exc[i]=[...g("ex_"+i).children].map(e=>({d:e.querySelector(".ed").value,n:e.querySelector(".en").value,a:e.querySelector(".ea").value==="1"}))});
  xs(m.committee).forEach(([k])=>o.f[k]=v(k));o.f.rmn=v("rmn");return o;
}
function applyDraft(id){
  let raw=null;try{raw=localStorage.getItem(dk(id,S.modal.mo))}catch(e){}
  if(!raw)return;
  try{const o=JSON.parse(raw).data,m=D.members.find(x=>x.id===id);
    ks(m.committee).forEach(([i])=>{$("#lg_"+i).innerHTML="";$("#ex_"+i).innerHTML="";(o.log[i]||[]).forEach(x=>addLog(i,x.d,x.n,x.q,x.l));(o.exc[i]||[]).forEach(x=>addEx(i,x.d,x.n,x.a))});
    Object.keys(o.f).forEach(k=>{const el=document.getElementById(k);if(el)el.value=o.f[k]});
    const ds=document.getElementById("ds");if(ds)ds.textContent="↺ تم استرجاع مسودتك";
  }catch(e){}
}
function memDraftCollect(){return{me:$("#me").value,mn:$("#mn").value,mr:$("#mr").value,mc:$("#mc").value,fl:[...document.querySelectorAll(".fl:checked")].map(x=>x.value),bc:chipsVal("mbcs"),bp:($("#mbp")||{}).value||""}}
function applyMemDraft(){
  let raw=null;try{raw=localStorage.getItem("tm-draft:mem:"+(S.modal.id||"new"))}catch(e){}
  if(!raw)return;
  try{const o=JSON.parse(raw).data;["me","mn","mr","mc"].forEach(k=>{if(o[k]!=null&&$("#"+k))$("#"+k).value=o[k]});document.querySelectorAll(".fl").forEach(x=>x.checked=o.fl.includes(x.value));document.querySelectorAll("#mbcs .bcm").forEach(x=>x.classList.toggle("on",(o.bc||[]).includes(x.dataset.c)));if($("#mbp")&&o.bp!=null)$("#mbp").value=o.bp;togFl();togRole();const ds=document.getElementById("ds");if(ds)ds.textContent="↺ تم استرجاع مسودتك"}catch(e){}
}
function draftSave(e){
  if(!S.modal||!me||(e&&e.target&&e.target.id==="rm"))return;
  clearTimeout(dT);
  dT=setTimeout(()=>{try{
    const ds=document.getElementById("ds");
    if(S.modal.t==="rec"&&document.getElementById("rm")){
      localStorage.setItem(dk(S.modal.id,S.modal.mo||$("#rm").value),JSON.stringify({data:draftCollect(),ts:Date.now()}));
      localStorage.setItem("tm-open-modal",JSON.stringify(S.modal));if(ds)ds.textContent="✓ تم الحفظ التلقائي";
    }else if(S.modal.t==="mem"&&document.getElementById("mn")){
      localStorage.setItem("tm-draft:mem:"+(S.modal.id||"new"),JSON.stringify({data:memDraftCollect(),ts:Date.now()}));
      localStorage.setItem("tm-open-modal",JSON.stringify(S.modal));if(ds)ds.textContent="✓ تم الحفظ التلقائي";
    }
  }catch(err){}},350);
}

function render(){
  let h;
  if(S.recover)h=recoverView();
  else if(!session)h=loginView();
  else if(!loaded)h=`<div class="auth"><div class="box"><div class="crest">YLY</div><p class="sub">جاري تحميل بياناتك…</p></div></div>`;
  else if(!me){const st=S.signup;h=topbar()+`<div class="card"><b>${st==="rejected"?"تم رفض طلبك":"طلبك قيد المراجعة"}</b><p>${st==="rejected"?"تواصل مع الإدارة لو فيه خطأ.":st==="pending"?"تم استلام طلب تسجيلك، وهيتفعّل حسابك أول ما الإدارة توافق عليه.":(S.msg?esc(S.msg):"الإيميل ده مش مسجل عند الأدمن. كلّمه عشان يضيفك ثم سجل دخول تاني.")}</p><button class="g" onclick="refresh()">تحديث</button></div>`}
  else if(isAdm())h=adminView();
  else if(isMgr())h=mgrView();
  else if(isBoardAcc())h=topbar()+tabBar([["bcom","📊 تقييمات لجنتي"],["me","حسابي"],["leaders","👥 مسؤولو اللجنة"]].concat(dTab()))+(S.tab==="me"?memberView(me,true):S.tab==="leaders"?leadersView(me.committee):S.tab==="designs"&&canDesign()?designsView():bcomView());
  else h=topbar()+tabBar([["me","حسابي"],["leaders","👥 مسؤولو اللجنة"]].concat(dTab()))+(S.tab==="leaders"?leadersView(me.committee):S.tab==="designs"&&canDesign()?designsView():memberView(me,true));
  const ok=!!(S.modal&&me&&(isAdm()||(isMgr()&&["rec","view","hist"].includes(S.modal.t))||(isBoardAcc()&&["view","hist"].includes(S.modal.t))));
  $("#app").innerHTML=h+(ok?modal():"");
  if(session&&me&&S.tab==="designs"&&canDesign())setTimeout(dDrawAll,0);
  if(ok&&S.modal.t==="rec")fillRec(S.modal.id);
  if(ok&&S.modal.t==="mem")applyMemDraft();
  try{if(ok&&["rec","mem"].includes(S.modal.t))localStorage.setItem("tm-open-modal",JSON.stringify(S.modal));else if(!S.modal)localStorage.removeItem("tm-open-modal")}catch(e){}
}

boot();

name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.webmanifest www/ 2>/dev/null || true
          cp icon-*.png www/ 2>/dev/null || true
          cp apple-touch-icon.png www/ 2>/dev/null || true
          cp bg.jpg logo.png www/ 2>/dev/null || true

      - name: Install and add Android
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Camera permission (QR scanner)
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: App icon
        run: |
          if [ -f icon-512.png ]; then
            sudo apt-get install -y imagemagick
            R=android/app/src/main/res
            rm -rf $R/mipmap-anydpi-v26
            for s in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              d=${s%%:*}; p=${s##*:}
              for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
                convert icon-512.png -resize ${p}x${p} $R/mipmap-$d/$n.png
              done
            done
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: YLY-Dakahlia-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
